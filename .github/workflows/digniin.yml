name: Digniinaha SNMA
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: digniin
  cancel-in-progress: false
jobs:
  cusbooneysii:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Soo qaado digniinaha
        run: python3 -I .github/scripts/digniin.py digniin.json
      - name: Kaydi haddii ay isbeddeleen
        run: |
          if [ -n "$(git status --porcelain digniin.json)" ]; then
            git config user.name "Cirday"
            git config user.email "shuraym7000@gmail.com"
            git add digniin.json
            git commit -m "Digniinaha SNMA: cusbooneysiin"
            git pull --rebase -q && git push
          fi
